# Django service — config yahan (backend/) rakhi hai, root par nahi.
# Railway dashboard → is service → Settings: "Config as code" path = backend/railway.toml
# (repo root se path; Dockerfile bhi root par hai is liye dockerfilePath = "Dockerfile".)
# Reference: https://docs.railway.app/config-as-code/reference

[build]
builder = "DOCKERFILE"
# Repository root se relative (backend/ folder se nahi).
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["sh", "-c", "python manage.py migrate --noinput"]
# Image mein backend/ flat /app par copy hota hai — yahan "cd backend" mat lagayein.
startCommand = "sh -c 'exec gunicorn alybank.wsgi:application --bind 0.0.0.0:${PORT:-8080} --workers 2 --threads 4 --timeout 120'"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
